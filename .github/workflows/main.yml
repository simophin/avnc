name: Main

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleCi

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        working-directory: ./app/build/outputs/apk/ci/
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --in app-ci-unsigned.apk --out app-ci.apk --ks "$GITHUB_WORKSPACE/signing/release.jks" --ks-key-alias release --ks-pass 'env:RELEASE_KEYSTORE_PASSWORD'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app-ci.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/ci/app-ci.apk
