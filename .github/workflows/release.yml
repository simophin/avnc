name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag or commit to test (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

    steps:
      - name: Checkout build ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build signed forked APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi
          ./gradlew --no-daemon assembleForked

      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/forked/app-forked.apk
          mkdir -p release-assets
          cp app/build/outputs/apk/forked/app-forked.apk "release-assets/AVNC-${RELEASE_TAG}-forked.apk"

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "release-assets/AVNC-${RELEASE_TAG}-forked.apk" --clobber

      - name: Save APK from manual test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: forked-apk
          archive: false
          path: app/build/outputs/apk/forked/app-forked.apk
